<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0a0a0f"/>
  <title>CAMMOT — Camera Remote Control</title>
  <style>
    /* ==================== RESET & BASE ==================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.08);
      --text: #e8e8ed;
      --text-dim: #888;
      --accent: #6c5ce7;
      --accent-hover: #7c6cf7;
      --green: #00b894;
      --red: #e17055;
      --yellow: #fdcb6e;
      --blue: #74b9ff;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
      line-height: 1.5;
    }

    /* ==================== HEADER ==================== */
    .header {
      text-align: center;
      padding: 20px 0 16px;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* ==================== SERVER URL BAR ==================== */
    .url-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin: 12px auto;
      max-width: 500px;
      word-break: break-all;
    }
    .url-bar span { color: var(--green); font-weight: 600; }

    /* ==================== CONNECTION STATUS ==================== */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      margin: 12px auto;
      max-width: 500px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }
    .status-dot.connecting { background: var(--yellow); animation: pulse 1s infinite; }
    .status-text { font-size: 0.85rem; color: var(--text-dim); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ==================== ROLE SELECTOR ==================== */
    .role-selector {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 16px auto;
      max-width: 500px;
    }
    .role-btn {
      flex: 1;
      padding: 14px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }
    .role-btn:hover { background: var(--surface-hover); }
    .role-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .role-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .role-btn .emoji { font-size: 1.2rem; display: block; margin-bottom: 4px; }

    /* ==================== VIDEO CONTAINER ==================== */
    .video-wrapper {
      position: relative;
      background: #000;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin: 16px auto;
      max-width: 600px;
      aspect-ratio: 4/3;
      display: none;
    }
    .video-wrapper.active { display: block; }
    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
    }
    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    .video-placeholder .icon { font-size: 2.5rem; margin-bottom: 8px; }

    /* ==================== CONTROLS PANEL ==================== */
    .controls-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin: 16px auto;
      max-width: 600px;
      display: none;
    }
    .controls-panel.active { display: block; }
    .controls-panel h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }
    .ctrl-btn {
      padding: 10px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
    }
    .ctrl-btn:hover { background: var(--surface-hover); border-color: var(--accent); }
    .ctrl-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .ctrl-btn.danger { border-color: var(--red); color: var(--red); }
    .ctrl-btn.danger:hover { background: rgba(225,112,85,0.15); }
    .ctrl-btn.success { border-color: var(--green); color: var(--green); }
    .ctrl-btn .emoji { font-size: 1rem; }

    /* ==================== RECORDING INDICATOR ==================== */
    .recording-indicator {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      margin-top: 10px;
      background: rgba(225,112,85,0.1);
      border: 1px solid rgba(225,112,85,0.3);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: var(--red);
    }
    .recording-indicator.active { display: flex; }
    .rec-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1s infinite;
    }

    /* ==================== DOWNLOAD LINK ==================== */
    .download-link {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: rgba(116,185,255,0.1);
      border: 1px solid rgba(116,185,255,0.3);
      border-radius: var(--radius-sm);
      color: var(--blue);
      text-align: center;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .download-link.active { display: block; }
    .download-link:hover { background: rgba(116,185,255,0.2); }

    /* ==================== TOAST NOTIFICATIONS ==================== */
    .toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: rgba(20,20,30,0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      font-size: 0.85rem;
      color: var(--text);
      max-width: 320px;
      text-align: center;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 3s forwards;
      pointer-events: auto;
    }
    .toast.error { border-color: var(--red); color: var(--red); }
    .toast.success { border-color: var(--green); color: var(--green); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; }
      to { opacity: 0; transform: translateY(-10px); }
    }

    /* ==================== RECONNECT BANNER ==================== */
    .reconnect-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      margin: 12px auto;
      max-width: 500px;
      background: rgba(253,203,110,0.1);
      border: 1px solid rgba(253,203,110,0.3);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: var(--yellow);
    }
    .reconnect-banner.active { display: flex; }
    .reconnect-banner button {
      padding: 4px 12px;
      border: 1px solid var(--yellow);
      border-radius: 6px;
      background: transparent;
      color: var(--yellow);
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* ==================== FOOTER ==================== */
    .footer {
      text-align: center;
      padding: 20px 0 8px;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 400px) {
      .btn-grid { grid-template-columns: 1fr 1fr; }
      .role-btn { padding: 12px 10px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Header -->
<div class="header">
  <h1>📸 CAMMOT</h1>
  <p>Camera Remote Control via WebRTC</p>
</div>

<!-- Server URL -->
<div class="url-bar">🌐 Server: <span id="serverUrl">...</span></div>

<!-- Connection Status -->
<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <div class="status-text" id="statusText">Menunggu...</div>
</div>

<!-- Reconnect Banner -->
<div class="reconnect-banner" id="reconnectBanner">
  ⚠️ Broadcaster terputus — mencoba ulang...
  <button id="btnReconnectNow" onclick="reconnectNow()">Hubungkan</button>
</div>

<!-- Role Selector -->
<div class="role-selector">
  <button class="role-btn" id="btnStart" onclick="startBroadcast()">
    <span class="emoji">📷</span>
    Broadcast
  </button>
  <button class="role-btn" id="btnView" onclick="startViewing()">
    <span class="emoji">👁️</span>
    Lihat
  </button>
</div>

<!-- Local Video (Broadcaster) -->
<div class="video-wrapper" id="localVideoWrapper">
  <video id="localVideo" autoplay playsinline muted></video>
  <div class="video-label">📷 KAMU</div>
  <div class="video-placeholder" id="localPlaceholder">
    <span class="icon">📷</span>
    <span>Menunggu kamera...</span>
  </div>
</div>

<!-- Remote Video (Viewer) -->
<div class="video-wrapper" id="remoteVideoWrapper">
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="video-label">👁️ REMOTE</div>
  <div class="video-placeholder" id="remotePlaceholder">
    <span class="icon">📡</span>
    <span>Menunggu stream...</span>
  </div>
</div>

<!-- Broadcaster Controls -->
<div class="controls-panel" id="broadcasterControls">
  <h3>🎛️ Kontrol Broadcaster</h3>
  <div class="btn-grid">
    <button class="ctrl-btn" onclick="switchCamera()"><span class="emoji">🔄</span> Ganti Kamera</button>
    <button class="ctrl-btn" onclick="toggleTorch()"><span class="emoji">🔦</span> Flashlight</button>
    <button class="ctrl-btn" onclick="snapPhoto('local')"><span class="emoji">📸</span> Foto</button>
    <button class="ctrl-btn" onclick="toggleAudio()"><span class="emoji">🔊</span> Audio</button>
    <button class="ctrl-btn" onclick="goFullscreen('local')"><span class="emoji">🖥️</span> Fullscreen</button>
    <button class="ctrl-btn danger" onclick="stopBroadcast()"><span class="emoji">⏹️</span> Berhenti</button>
  </div>
</div>

<!-- Viewer Controls -->
<div class="controls-panel" id="viewerControls">
  <h3>🎛️ Kontrol Viewer</h3>
  <div class="btn-grid">
    <button class="ctrl-btn success" id="btnRecord" onclick="startRecording()"><span class="emoji">⏺️</span> Rekam</button>
    <button class="ctrl-btn danger" id="btnStopRecord" onclick="stopRecording()" disabled><span class="emoji">⏹️</span> Stop</button>
    <button class="ctrl-btn" onclick="snapPhoto('remote')"><span class="emoji">📸</span> Foto</button>
    <button class="ctrl-btn" onclick="goFullscreen('remote')"><span class="emoji">🖥️</span> Fullscreen</button>
  </div>
  <div class="recording-indicator" id="recordingIndicator">
    <div class="rec-dot"></div>
    <span>Merekam: <strong id="recordTimeDisplay">00:00</strong></span>
  </div>
  <a class="download-link" id="downloadLink" download="rekaman.webm">⬇️ Download Rekaman</a>
</div>

<!-- Footer -->
<div class="footer">
  CAMMOT v1.0 — WebRTC P2P Camera Remote
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ==================== CONFIG ====================
const socket = io();

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "stun:stun2.l.google.com:19302" },
    {
      urls: "turn:openrelay.metered.ca:80",
      username: "openrelayproject",
      credential: "openrelayproject"
    },
    {
      urls: "turn:openrelay.metered.ca:443",
      username: "openrelayproject",
      credential: "openrelayproject"
    }
  ]
};

// ==================== STATE ====================
let localStream = null;
let peerConnection = null;
let isBroadcaster = false;
let facingMode = 'environment';
let audioEnabled = false;
let torchEnabled = false;
let mediaRecorder = null;
let recordedChunks = [];
let recordTimer = null;
let recordStartTime = null;
let reconnectTimer = null;
let reconnectAttempts = 0;
const MAX_RECONNECT_ATTEMPTS = 10;

// ==================== DOM REFS ====================
const $ = id => document.getElementById(id);
const localVideo = $('localVideo');
const remoteVideo = $('remoteVideo');
const localVideoWrapper = $('localVideoWrapper');
const remoteVideoWrapper = $('remoteVideoWrapper');
const localPlaceholder = $('localPlaceholder');
const remotePlaceholder = $('remotePlaceholder');
const broadcasterControls = $('broadcasterControls');
const viewerControls = $('viewerControls');
const btnStart = $('btnStart');
const btnView = $('btnView');
const btnRecord = $('btnRecord');
const btnStopRecord = $('btnStopRecord');
const recordingIndicator = $('recordingIndicator');
const recordTimeDisplay = $('recordTimeDisplay');
const downloadLink = $('downloadLink');
const statusDot = $('statusDot');
const statusText = $('statusText');
const reconnectBanner = $('reconnectBanner');
const serverUrl = $('serverUrl');
const toastContainer = $('toastContainer');

// ==================== INIT ====================
function init() {
  const proto = location.protocol === 'https:' ? 'https' : 'http';
  serverUrl.textContent = `${proto}://${location.host}`;
  setStatus('waiting', 'Siap — pilih mode untuk mulai');
}

// ==================== TOAST ====================
function showToast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  toastContainer.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ==================== STATUS ====================
function setStatus(state, msg) {
  statusDot.className = 'status-dot';
  if (state === 'online') { statusDot.classList.add('online'); }
  else if (state === 'offline') { statusDot.classList.add('offline'); }
  else if (state === 'connecting') { statusDot.classList.add('connecting'); }
  statusText.textContent = msg;
}

// ==================== BROADCASTER ====================
async function startBroadcast() {
  if (localStream) { showToast('Kamera sudah aktif', 'error'); return; }
  if (isBroadcaster) { showToast('Sudah dalam mode broadcast', 'error'); return; }

  setStatus('connecting', 'Membuka kamera...');
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode },
      audio: audioEnabled
    });
    localVideo.srcObject = localStream;
    localVideoWrapper.classList.add('active');
    localPlaceholder.style.display = 'none';
    broadcasterControls.classList.add('active');
    btnStart.classList.add('active');
    btnView.disabled = true;
    isBroadcaster = true;
    socket.emit('register', 'broadcaster');
    setStatus('online', 'Broadcasting...');
    showToast('✅ Kamera aktif — broadcast dimulai', 'success');
  } catch (err) {
    setStatus('offline', 'Gagal akses kamera');
    showToast(`❌ ${err.message}`, 'error');
  }
}

async function stopBroadcast() {
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  localVideo.srcObject = null;
  localVideoWrapper.classList.remove('active');
  localPlaceholder.style.display = '';
  broadcasterControls.classList.remove('active');
  btnStart.classList.remove('active');
  btnView.disabled = false;
  isBroadcaster = false;
  setStatus('offline', 'Broadcast dihentikan');
  showToast('⏹️ Broadcast dihentikan');
}

async function updateStream() {
  try {
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
    }
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode },
      audio: audioEnabled
    });
    localVideo.srcObject = localStream;

    if (torchEnabled) {
      const track = localStream.getVideoTracks()[0];
      if (track?.getCapabilities?.().torch) {
        await track.applyConstraints({ advanced: [{ torch: true }] });
      }
    }

    if (peerConnection && localStream) {
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        let sender = peerConnection.getSenders().find(s => s.track?.kind === 'video');
        if (sender) {
          await sender.replaceTrack(videoTrack);
        } else {
          peerConnection.addTrack(videoTrack, localStream);
        }
      }
      if (audioEnabled) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
          let audioSender = peerConnection.getSenders().find(s => s.track?.kind === 'audio');
          if (audioSender) {
            await audioSender.replaceTrack(audioTrack);
          } else {
            peerConnection.addTrack(audioTrack, localStream);
          }
        }
      }
    }
    setStatus('online', 'Stream diperbarui');
  } catch (err) {
    showToast(`Gagal update stream: ${err.message}`, 'error');
  }
}

async function switchCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  await updateStream();
  showToast(`🔄 Kamera: ${facingMode === 'environment' ? 'Belakang' : 'Depan'}`);
}

async function toggleTorch() {
  if (!localStream) return;
  const track = localStream.getVideoTracks()[0];
  if (!track?.getCapabilities?.().torch) {
    showToast('Torch tidak didukung di perangkat ini', 'error');
    return;
  }
  torchEnabled = !torchEnabled;
  await track.applyConstraints({ advanced: [{ torch: torchEnabled }] });
  showToast(torchEnabled ? '🔦 Flashlight ON' : '🔦 Flashlight OFF');
}

async function toggleAudio() {
  audioEnabled = !audioEnabled;
  await updateStream();
  showToast(audioEnabled ? '🔊 Audio ON' : '🔇 Audio OFF');
}

// ==================== VIEWER ====================
async function startViewing() {
  if (peerConnection) { showToast('Sudah terhubung', 'error'); return; }

  setStatus('connecting', 'Menghubungkan ke broadcaster...');
  btnView.classList.add('active');
  btnStart.disabled = true;
  reconnectAttempts = 0;

  createPeerConnection();

  try {
    const pc = peerConnection;
    pc.addTransceiver('video', { direction: 'recvonly' });
    if (audioEnabled) pc.addTransceiver('audio', { direction: 'recvonly' });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('offer', { sdp: pc.localDescription });
    showToast('📡 Menghubungkan...');
  } catch (err) {
    setStatus('offline', 'Gagal membuat koneksi');
    showToast(`❌ ${err.message}`, 'error');
    cleanupViewer();
  }
}

function createPeerConnection() {
  const pc = new RTCPeerConnection(rtcConfig);

  pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit('candidate', { candidate: e.candidate });
  };

  pc.oniceconnectionstatechange = () => {
    const state = pc.iceConnectionState;
    if (state === 'connected' || state === 'completed') {
      setStatus('online', 'Terhubung!');
      showToast('✅ WebRTC terhubung', 'success');
    } else if (state === 'failed' || state === 'disconnected') {
      setStatus('offline', 'Koneksi terputus');
      showToast('⚠️ Koneksi WebRTC gagal', 'error');
    }
  };

  pc.onconnectionstatechange = () => {
    const state = pc.connectionState;
    if (state === 'failed') {
      setStatus('offline', 'Koneksi gagal');
      showToast('❌ Koneksi WebRTC gagal — coba lagi', 'error');
      cleanupViewer();
    }
  };

  pc.ontrack = (e) => {
    const remoteStream = e.streams[0];
    remoteVideo.srcObject = remoteStream;
    remoteVideoWrapper.classList.add('active');
    remotePlaceholder.style.display = 'none';
    viewerControls.classList.add('active');
    setStatus('online', 'Menampilkan kamera remote');
    showToast('✅ Stream remote aktif', 'success');
  };

  peerConnection = pc;
}

function cleanupViewer() {
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  remoteVideo.srcObject = null;
  remoteVideoWrapper.classList.remove('active');
  remotePlaceholder.style.display = '';
  viewerControls.classList.remove('active');
  btnView.classList.remove('active');
  btnStart.disabled = false;
}

// ==================== AUTO-RECONNECT ====================
function triggerAutoReconnect() {
  if (reconnectTimer) return;
  reconnectAttempts = 0;
  reconnectBanner.classList.add('active');
  setStatus('connecting', 'Mencoba terhubung ulang...');
  attemptReconnect();
}

function attemptReconnect() {
  if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
    reconnectBanner.classList.remove('active');
    reconnectTimer = null;
    setStatus('offline', 'Gagal terhubung ulang');
    showToast('⚠️ Gagal terhubung setelah beberapa percobaan', 'error');
    cleanupViewer();
    return;
  }

  reconnectAttempts++;
  setStatus('connecting', `Reconnect percobaan ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS}...`);
  cleanupViewer();

  setTimeout(() => {
    createPeerConnection();
    const pc = peerConnection;
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.createOffer()
      .then(offer => pc.setLocalDescription(offer))
      .then(() => socket.emit('offer', { sdp: pc.localDescription }))
      .catch(() => attemptReconnect());
  }, 2000 * reconnectAttempts);
}

function reconnectNow() {
  reconnectBanner.classList.remove('active');
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  reconnectAttempts = 0;
  attemptReconnect();
}

// ==================== PHOTO ====================
function snapPhoto(source) {
  const video = source === 'local' ? localVideo : remoteVideo;
  if (!video.srcObject) { showToast('Tidak ada stream untuk difoto', 'error'); return; }

  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cammot_${Date.now()}.png`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('📸 Foto disimpan', 'success');
  }, 'image/png');
}

// ==================== RECORDING ====================
function startRecording() {
  if (!remoteVideo.srcObject) { showToast('Tidak ada stream untuk direkam', 'error'); return; }

  recordedChunks = [];
  mediaRecorder = new MediaRecorder(remoteVideo.srcObject, { mimeType: 'video/webm' });

  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.classList.add('active');
    showToast('✅ Rekaman selesai!', 'success');
  };

  mediaRecorder.start();
  btnRecord.disabled = true;
  btnStopRecord.disabled = false;
  recordingIndicator.classList.add('active');
  downloadLink.classList.remove('active');
  recordStartTime = Date.now();
  recordTimer = setInterval(updateRecordTime, 1000);
  showToast('⏺️ Rekaman dimulai');
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  clearInterval(recordTimer);
  btnRecord.disabled = false;
  btnStopRecord.disabled = true;
  recordingIndicator.classList.remove('active');
  recordTimeDisplay.textContent = '00:00';
}

function updateRecordTime() {
  const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
  const min = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const sec = String(elapsed % 60).padStart(2, '0');
  recordTimeDisplay.textContent = `${min}:${sec}`;
}

// ==================== FULLSCREEN ====================
function goFullscreen(source) {
  const video = source === 'local' ? localVideo : remoteVideo;
  if (video.requestFullscreen) video.requestFullscreen();
  else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
  else if (video.msRequestFullscreen) video.msRequestFullscreen();
}

// ==================== SOCKET EVENTS ====================
socket.on('registered', (role) => {
  showToast(`✅ Terdaftar sebagai ${role}`, 'success');
});

socket.on('broadcaster-ready', () => {
  if (!isBroadcaster) {
    setStatus('online', 'Broadcaster siap — klik "Lihat" untuk connect');
  }
});

socket.on('offer', async (data) => {
  if (!isBroadcaster) return;

  if (!peerConnection) {
    createPeerConnection();
  }

  if (localStream) {
    localStream.getTracks().forEach(track => {
      const existing = peerConnection.getSenders().find(s => s.track?.kind === track.kind);
      if (!existing) peerConnection.addTrack(track, localStream);
    });
  }

  try {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    socket.emit('answer', { sdp: peerConnection.localDescription });
  } catch (err) {
    showToast(`Gagal handle offer: ${err.message}`, 'error');
  }
});

socket.on('answer', async (data) => {
  if (isBroadcaster || !peerConnection) return;
  try {
    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
    setStatus('connecting', 'Answer diterima, menghubungkan...');
  } catch (err) {
    showToast(`Gagal set answer: ${err.message}`, 'error');
  }
});

socket.on('candidate', async (data) => {
  if (!peerConnection) return;
  try {
    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
  } catch (err) {
    console.warn('Candidate error:', err);
  }
});

socket.on('broadcaster-disconnected', () => {
  showToast('⚠️ Broadcaster terputus', 'error');
  setStatus('offline', 'Broadcaster terputus');
  cleanupViewer();
  triggerAutoReconnect();
});

socket.on('error', (msg) => {
  showToast(`Server: ${msg}`, 'error');
});

// ==================== START ====================
init();
</script>
